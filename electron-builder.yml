# Unsigned (ad-hoc) builds for local use. Signing with a Developer ID and
# notarization are optional and not set up: see README.md → "Installing the
# unsigned app". FFmpeg is not bundled (docs/FFMPEG.md): xBot uses the user's.
appId: app.xbot.desktop
productName: xBot
directories:
  output: dist
  # build/icon.png (1024×1024, from resources/icon.svg by `pnpm icons`) becomes the .icns.
  buildResources: build
files:
  - out/**
  - package.json
  # better-sqlite3 ships every platform's N-API prebuild plus SQLite's sources;
  # keep only this platform's prebuild. (app-builder-lib only honours negated
  # patterns for node_modules, hence one negated extglob.)
  - "!node_modules/better-sqlite3/{deps,src,benchmark,docs}/**"
  - "!node_modules/better-sqlite3/prebuilds/!(${platform}-${arch}.node)"
  # Build-time headers only.
  - "!node_modules/node-addon-api/**"
asarUnpack:
  - "**/*.node"
extraResources:
  # Contents/Resources/: the tray's template PNGs, and preview mode's sample
  # media (Contents/Resources/fixtures/, for `--preview`).
  - from: resources
    to: .
    filter:
      - trayTemplate*.png
      - fixtures/my-tiny-tool.png
      - fixtures/my-tiny-tool-framed.png
      - fixtures/my-tiny-tool.mp4
# N-API prebuilds are ABI-stable across Electron versions: nothing to rebuild.
npmRebuild: false
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  onlyLoadAppFromAsar: true
mac:
  # One build per architecture, not universal: each ships only its own
  # better-sqlite3 prebuild (the filter above), which a universal merge can't
  # reconcile. dist/ gets a .dmg and a .zip for each.
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  category: public.app-category.productivity
  # Ad-hoc signature: Apple Silicon refuses to launch fully unsigned binaries.
  # To sign and notarize instead, set `identity` to a Developer ID Application
  # certificate, `hardenedRuntime: true`, and `notarize: true` (with the Apple
  # ID or API key environment variables electron-builder documents).
  identity: "-"
  hardenedRuntime: false
  extendInfo:
    # Menu-bar app: no Dock icon, no app switcher entry.
    LSUIElement: true
dmg:
  sign: false
linux:
  # Only so `pnpm package` also runs on Linux CI; xBot targets macOS.
  target:
    - zip
  category: Utility
