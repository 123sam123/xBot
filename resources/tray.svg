<!-- xBot tray glyph: four "audio bars". Drawn on an 18×18 grid with whole-pixel
     edges so the 1× (18 px) and 2× (36 px) renders stay crisp. Black on
     transparent: macOS tints template images for light and dark menu bars. -->
<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 18 18">
  <rect x="2" y="6" width="2" height="6" rx="1" fill="#000"/>
  <rect x="6" y="2" width="2" height="14" rx="1" fill="#000"/>
  <rect x="10" y="4" width="2" height="10" rx="1" fill="#000"/>
  <rect x="14" y="7" width="2" height="4" rx="1" fill="#000"/>
</svg>
